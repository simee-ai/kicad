name: wasi-sdk
# Package wasi-sdk's own release, trimmed to what compiles and links a C++ model into a wasm32-wasip1 module (simee-core
# builds its peripherals.wasm with it, and its app ships it packed to compile a project's own C++ model), for macOS
# arm64 and x86_64, Linux x86_64 and arm64 and Windows x86_64, check each archive where it runs, and publish them as a
# release (wasi-sdk-<version>-<n>). The release is pinned in wasm_toolchain/components.py; see README, "Wasm toolchain".

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (off = package and check only)
        type: boolean
        default: true

permissions:
  contents: read  # only the job that publishes writes (#41)

env:
  UV_PYTHON: "3.12"  # tarfile's extraction filters

jobs:
  package:  # wasi-sdk's archives are trimmed and repackaged, not built, so one job makes every host's
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kicad-bundle/wasi-sdk
          key: wasi-sdk-sources-${{ hashFiles('wasm_toolchain/components.py') }}
      - run: uv run wasm-toolchain package --no-check
      - uses: actions/upload-artifact@v4
        with:
          name: wasi-sdk
          path: dist/*
          compression-level: 0  # archives already

  check:  # each archive where it runs, unpacked into a path with a space, with an empty PATH
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host: macos-arm64, runner: macos-15}
          - {host: macos-x86_64, runner: macos-15, rosetta: true}
          - {host: linux-x86_64, runner: ubuntu-latest}
          - {host: linux-arm64, runner: ubuntu-24.04-arm}
          - {host: windows-x86_64, runner: windows-2022}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Rosetta (to check the x86_64 toolchain on this arm64 runner)
        if: matrix.rosetta
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: actions/download-artifact@v4
        with:
          name: wasi-sdk
          path: dist
      - shell: bash
        run: uv run wasm-toolchain check dist/wasi-sdk-*-${{ matrix.host }}.*

  release:
    needs: check
    if: inputs.publish
    permissions:
      contents: write  # the release and its tag
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: wasi-sdk
          path: dist
      - name: Publish
        run: |
          gh release list --limit 500 --json tagName -q '.[].tagName' > tags.txt
          tag=$(uv run python -m wasm_toolchain.publish --dist dist --tags tags.txt \
                --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          # simee-ci may have changed a workflow during the build: kicad_bundle/tag_target.py
          target=$(uv run python -m kicad_bundle.tag_target --sha "$GITHUB_SHA" \
                   wasm_toolchain kicad_bundle pyproject.toml uv.lock .github/workflows/wasi-sdk.yml)
          gh release create "$tag" dist/* --target "$target" --latest=false \
            --title "wasi-sdk ${tag#wasi-sdk-}" --notes-file notes.md
          echo "Published $tag at $target" >> "$GITHUB_STEP_SUMMARY"
